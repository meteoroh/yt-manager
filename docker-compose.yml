version: "3.8"

services:
  yt-manager:
    # Option A: Local build
    build:
      context: .
      dockerfile: Dockerfile
    # Option B: Use pre-built image from GitHub Packages (GHCR)
    # image: ghcr.io/<your-github-username>/yt-manager:latest
    container_name: yt-manager
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # NAS directory paths
      - DOWNLOADS_DIR=/downloads
      - MEDIA_DIR=/media
      - ARCHIVE_FILE_PATH=/media/archive.txt
      - DB_PATH=/media/yt_manager.db

      # MeTube URL (use http://metube:8081 if in the same compose, or NAS IP if running separately)
      - METUBE_URL=http://metube:8081

      # Scan interval (in minutes)
      - SCAN_INTERVAL_MINUTES=120
      - AUTO_SCAN_ON_STARTUP=true

      # Scan exclusion settings (comma-separated)
      - EXCLUDE_DIRS=backup,temp,/media/family
      - EXCLUDE_PATTERNS=*sample*,*.temp.mp4

      # Playlist configuration
      - PLAYLIST_MAX_ITEMS=200

      # Telegram bot configuration (optional)
      - TELEGRAM_BOT_TOKEN=
      - TELEGRAM_ALLOWED_USERS=

      # Timezone
      - TZ=Asia/Seoul
    volumes:
      # Map to your actual NAS host paths
      - /volume1/downloads:/downloads
      - /volume1/media:/media
    # Enable if running together with metube
    # depends_on:
    #   - metube

  # (Optional) Uncomment below to run MeTube in the same docker-compose
  # metube:
  #   image: ghcr.io/alexta69/metube
  #   container_name: metube
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     - OUTPUT_TEMPLATE=%(title)s [%(extractor)s-%(id)s].%(ext)s
  #     - YTDL_OPTIONS={"download_archive": "/media/archive.txt"}
  #   volumes:
  #     - /volume1/downloads:/downloads
  #     - /volume1/media:/media:ro
