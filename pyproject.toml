[project]
name = "yt-manager"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "meteoroh", email = "adalove369@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "python-telegram-bot>=22.8",
    "uvicorn[standard]>=0.53.0",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
yt-manager = "yt_manager:main"
yt-migrate = "yt_manager.tools.migrate_filenames:main"

[build-system]
requires = ["uv_build>=0.12.14,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
